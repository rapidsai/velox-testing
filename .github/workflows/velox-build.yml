name: velox-build

on:
  workflow_call:
    inputs:
      velox_repository:
        description: 'Velox repository'
        type: string
        required: true
      velox_sha:
        description: 'Resolved full Velox commit SHA'
        type: string
        required: true
      velox_short_sha:
        description: 'Resolved short Velox commit SHA'
        type: string
        required: true
      date:
        description: 'Build date (YYYYMMDD)'
        type: string
        required: true
      build_type:
        description: 'One of: [nightly, manual]'
        type: string
        required: false
        default: 'manual'
      build_variant:
        description: 'One of: [upstream, manual]'
        type: string
        required: false
        default: 'manual'
      tag_prefix:
        description: 'Optional prefix applied to image and cache tags'
        type: string
      architecture:
        description: 'Optional architecture; empty builds amd64 and arm64'
        type: string
      cuda_version:
        description: 'Optional CUDA version; empty builds CUDA 12.9, CUDA 13.1, and CPU images'
        type: string
      velox_ref:
        description: 'Requested Velox branch, tag, or SHA for extended provenance'
        type: string
      build_created:
        description: 'RFC 3339 build timestamp for extended provenance'
        type: string
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-images
  TAG_PREFIX: ${{ inputs.tag_prefix }}
  MANIFEST_ARCHITECTURE: ${{ inputs.architecture }}
  MANIFEST_CUDA_VERSION: ${{ inputs.cuda_version }}

jobs:
  velox-deps:
    name: velox-deps (cuda${{ matrix.cuda_version }}, ${{ matrix.arch }})
    runs-on: linux-${{ matrix.arch }}-cpu16
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        arch: &architecture_matrix ${{ fromJSON(inputs.architecture != '' && format('["{0}"]', inputs.architecture) || '["amd64","arm64"]') }}
        cuda_version: ${{ fromJSON(inputs.cuda_version != '' && format('["{0}"]', inputs.cuda_version) || '["12.9","13.1"]') }}
    steps:
      - &checkout_velox_testing
        name: Checkout velox-testing
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          path: velox-testing
          persist-credentials: false

      - &checkout_velox
        name: Checkout Velox
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: ${{ inputs.velox_repository }}
          ref: ${{ inputs.velox_sha }}
          path: velox
          persist-credentials: false

      # TODO: Remove this workaround once https://github.com/facebookincubator/velox/pull/17060 is merged.
      - &patch_arm_build_target
        name: Patch ARM_BUILD_TARGET default to generic
        run: |
          sed -i 's/ARM_BUILD_TARGET:-"local"/ARM_BUILD_TARGET:-"generic"/' velox/scripts/setup-helper-functions.sh

      - &setup_proxy_cache
        name: Setup proxy cache
        uses: nv-gha-runners/setup-proxy-cache@main  # zizmor: ignore[unpinned-uses]
        continue-on-error: true
        with:
          enable-apt: true

      - &setup_buildx
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2  # v3.10.0
        with:
          buildkitd-config: /etc/buildkit/buildkitd.toml
          driver-opts: network=host

      - &login_ghcr
        name: Log in to the Container registry
        uses: ./velox-testing/.github/actions/container-registry-login

      - name: Build and push Velox deps image
        id: push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83  # v6.18.0
        with:
          context: velox
          file: velox/scripts/docker/centos-multi.dockerfile
          target: adapters
          build-args: |
            ARM_BUILD_TARGET=generic
            CUDA_VERSION=${{ matrix.cuda_version }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG_PREFIX }}cache-velox-deps-cuda${{ matrix.cuda_version }}-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG_PREFIX }}cache-velox-deps-cuda${{ matrix.cuda_version }}-${{ matrix.arch }},mode=max
          outputs: type=registry,compression=zstd,force-compression=true,compression-level=15
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG_PREFIX }}velox-deps-${{ inputs.velox_short_sha }}-cuda${{ matrix.cuda_version }}-${{ inputs.date }}-${{ inputs.build_variant }}-${{ github.run_id }}-${{ matrix.arch }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f  # v3.2.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  velox-build:
    name: velox-build (${{ matrix.build == 'cpu' && 'cpu' || format('gpu-cuda{0}', matrix.build) }}, ${{ matrix.arch }})
    needs: [merge-velox-deps]
    runs-on: linux-${{ matrix.arch }}-cpu32
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        arch: *architecture_matrix
        build: ${{ fromJSON(inputs.cuda_version != '' && format('["{0}"]', inputs.cuda_version) || '["12.9","13.1","cpu"]') }}
    steps:
      - *checkout_velox_testing
      - *checkout_velox
      - *setup_proxy_cache
      - *setup_buildx
      - *login_ghcr

      - &setup_sccache
        name: Setup sccache
        id: sccache
        uses: ./velox-testing/.github/actions/sccache-setup
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          enable-dist: 'true'

      - &ensure_sccache
        name: Ensure sccache auth dir exists
        env:
          SCCACHE_ENABLED: ${{ steps.sccache.outputs.enabled }}
        run: |
          if [[ "${SCCACHE_ENABLED}" != "true" ]]; then
            echo "::error::sccache setup failed. sccache is required for ci-images builds."
            exit 1
          fi

      - &copy_dockerignore
        name: Copy .dockerignore
        run: cp velox-testing/.dockerignore .dockerignore

      - name: Determine deps image tag
        id: deps
        env:
          VELOX_SHORT_SHA: ${{ inputs.velox_short_sha }}
          BUILD_DATE: ${{ inputs.date }}
          BUILD_VARIANT: ${{ inputs.build_variant }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          CUDA: ${{ matrix.build == 'cpu' && '12.9' || matrix.build }}
        run: |
          echo "image=${REGISTRY}/${IMAGE_NAME}:${TAG_PREFIX}velox-deps-${VELOX_SHORT_SHA}-cuda${CUDA}-${BUILD_DATE}-${BUILD_VARIANT}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Determine image tag
        id: tag
        env:
          VELOX_SHORT_SHA: ${{ inputs.velox_short_sha }}
          BUILD_DATE: ${{ inputs.date }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          ARCH: ${{ matrix.arch }}
          BUILD_VARIANT: ${{ inputs.build_variant }}
          BUILD: ${{ matrix.build }}
        run: |
          if [[ "${BUILD}" == "cpu" ]]; then
            echo "tag=${TAG_PREFIX}velox-${VELOX_SHORT_SHA}-cpu-${BUILD_DATE}-${BUILD_VARIANT}-${GITHUB_RUN_ID}-${ARCH}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${TAG_PREFIX}velox-${VELOX_SHORT_SHA}-gpu-cuda${BUILD}-${BUILD_DATE}-${BUILD_VARIANT}-${GITHUB_RUN_ID}-${ARCH}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Velox image
        id: push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83  # v6.18.0
        with:
          context: .
          file: velox-testing/velox/docker/adapters_build.dockerfile
          network: host
          allow: network.host
          build-contexts: |
            ghcr.io/facebookincubator/velox-dev:adapters=docker-image://${{ steps.deps.outputs.image }}
          build-args: |
            BUILD_WITH_VELOX_ENABLE_CUDF=${{ matrix.build == 'cpu' && 'OFF' || 'ON' }}
            CUDA_ARCHITECTURES=${{ matrix.build == '13.1' && '75;80;86;90;100;120' || matrix.build == '12.9' && '70;75;80;86;90;100;120' || '70' }}
            CUDA_VERSION=${{ matrix.build == 'cpu' && '12.9' || matrix.build }}
            ENABLE_SCCACHE=ON
            NUM_THREADS=31
          secret-files: |
            github_token=${{ env.SCCACHE_AUTH_DIR }}/github_token
            aws_credentials=${{ env.SCCACHE_AUTH_DIR }}/aws_credentials
          outputs: type=registry,compression=zstd,force-compression=true,compression-level=15
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}

      - name: Apply extended provenance to Velox image
        if: ${{ inputs.build_created != '' }}
        id: provenance
        uses: ./velox-testing/.github/actions/apply-provenance-labels
        with:
          base_image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
          image_role: velox
          architecture: ${{ matrix.arch }}
          cuda_version: ${{ matrix.build != 'cpu' && matrix.build || '' }}
          build_created: ${{ inputs.build_created }}
          presto_sha: ''
          velox_sha: ${{ inputs.velox_sha }}
          velox_repository: ${{ inputs.velox_repository }}
          velox_branch: ${{ inputs.velox_ref }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f  # v3.2.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ inputs.build_created != '' && steps.provenance.outputs.digest || steps.push.outputs.digest }}
          push-to-registry: true

  merge-velox-deps:
    name: merge-manifests (velox-deps)
    needs: [velox-deps]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout velox-testing
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Log in to the Container registry
        uses: ./.github/actions/container-registry-login
      - name: Create and push multi-arch manifests
        env:
          VELOX_SHORT_SHA: ${{ inputs.velox_short_sha }}
          BUILD_DATE: ${{ inputs.date }}
          BUILD_TYPE: ${{ inputs.build_type }}
          BUILD_VARIANT: ${{ inputs.build_variant }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          source scripts/create_manifest.sh
          for cuda in "${cuda_versions[@]}"; do
            tag="${TAG_PREFIX}velox-deps-${VELOX_SHORT_SHA}-cuda${cuda}-${BUILD_DATE}"
            create_manifest "${tag}"
          done
          if [[ "${BUILD_TYPE}" == "nightly" && "${BUILD_VARIANT}" == "upstream" ]]; then
            for cuda in "${cuda_versions[@]}"; do
              tag="${TAG_PREFIX}velox-deps-${VELOX_SHORT_SHA}-cuda${cuda}-${BUILD_DATE}"
              create_manifest_alias "${tag}" "${TAG_PREFIX}velox-deps-latest-cuda${cuda}"
            done
          fi
      - name: Delete intermediate arch-specific tags
        if: ${{ inputs.architecture == '' }}
        continue-on-error: true
        uses: ./.github/actions/delete-arch-tags
        with:
          registry: ${{ env.REGISTRY }}
          image-name: ${{ env.IMAGE_NAME }}
          base-tags: |
            ${{ env.TAG_PREFIX }}velox-deps-${{ inputs.velox_short_sha }}-cuda${{ inputs.cuda_version || '12.9' }}-${{ inputs.date }}-${{ inputs.build_variant }}-${{ github.run_id }}
            ${{ inputs.cuda_version == '' && format('{0}velox-deps-{1}-cuda13.1-{2}-{3}-{4}', env.TAG_PREFIX, inputs.velox_short_sha, inputs.date, inputs.build_variant, github.run_id) || '' }}
  merge-velox-build:
    name: merge-manifests (velox-build)
    needs: [velox-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout velox-testing
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Log in to the Container registry
        uses: ./.github/actions/container-registry-login
      - name: Create and push multi-arch manifests
        env:
          VELOX_SHORT_SHA: ${{ inputs.velox_short_sha }}
          BUILD_DATE: ${{ inputs.date }}
          BUILD_TYPE: ${{ inputs.build_type }}
          BUILD_VARIANT: ${{ inputs.build_variant }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          source scripts/create_manifest.sh
          for cuda in "${cuda_versions[@]}"; do
            tag="${TAG_PREFIX}velox-${VELOX_SHORT_SHA}-gpu-cuda${cuda}-${BUILD_DATE}"
            create_manifest "${tag}"
          done
          if [[ -z "${MANIFEST_CUDA_VERSION}" ]]; then
            tag="${TAG_PREFIX}velox-${VELOX_SHORT_SHA}-cpu-${BUILD_DATE}"
            create_manifest "${tag}"
          fi
          if [[ "${BUILD_TYPE}" == "nightly" && "${BUILD_VARIANT}" == "upstream" ]]; then
            for cuda in "${cuda_versions[@]}"; do
              tag="${TAG_PREFIX}velox-${VELOX_SHORT_SHA}-gpu-cuda${cuda}-${BUILD_DATE}"
              create_manifest_alias "${tag}" "${TAG_PREFIX}velox-latest-gpu-cuda${cuda}"
            done
            if [[ -z "${MANIFEST_CUDA_VERSION}" ]]; then
              tag="${TAG_PREFIX}velox-${VELOX_SHORT_SHA}-cpu-${BUILD_DATE}"
              create_manifest_alias "${tag}" "${TAG_PREFIX}velox-latest-cpu"
            fi
          fi
      - name: Delete intermediate arch-specific tags
        if: ${{ inputs.architecture == '' }}
        continue-on-error: true
        uses: ./.github/actions/delete-arch-tags
        with:
          registry: ${{ env.REGISTRY }}
          image-name: ${{ env.IMAGE_NAME }}
          base-tags: |
            ${{ env.TAG_PREFIX }}velox-${{ inputs.velox_short_sha }}-gpu-cuda${{ inputs.cuda_version || '12.9' }}-${{ inputs.date }}-${{ inputs.build_variant }}-${{ github.run_id }}
            ${{ inputs.cuda_version == '' && format('{0}velox-{1}-gpu-cuda13.1-{2}-{3}-{4}', env.TAG_PREFIX, inputs.velox_short_sha, inputs.date, inputs.build_variant, github.run_id) || '' }}
            ${{ inputs.cuda_version == '' && format('{0}velox-{1}-cpu-{2}-{3}-{4}', env.TAG_PREFIX, inputs.velox_short_sha, inputs.date, inputs.build_variant, github.run_id) || '' }}
