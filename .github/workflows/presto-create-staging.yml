name: Presto Create Staging Branch

on:
  workflow_dispatch:
    inputs:
      base_repository: &base_repository
        description: Base Presto repository
        type: string
        required: false
        default: 'prestodb/presto'
      base_branch: &base_branch
        description: Base Presto branch
        type: string
        required: false
        default: 'master'
      target_repository: &target_repository
        description: Target Presto repository
        type: string
        required: false
        default: 'rapidsai/presto'
      target_branch: &target_branch
        description: Target Presto branch
        type: string
        required: false
        default: 'staging'
      auto_fetch_prs: &auto_fetch_prs
        description: >-
          Auto-fetch open non-draft staging prestodb/presto PRs from the project board.
        type: boolean
        required: false
        default: true
      pr_labels: &pr_labels
        description: Comma-separated PR labels to auto-fetch (overrides the project board)
        type: string
        required: false
        default: ''
      manual_pr_numbers: &manual_pr_numbers
        description: "Comma-separated PR numbers to merge (e.g., '12345,12346')"
        type: string
        required: false
        default: ''
      exclude_pr_numbers: &exclude_pr_numbers
        description: "Comma-separated PR numbers to exclude from auto-fetch results (e.g., '12345,12346')"
        type: string
        required: false
        default: ''
      force_push: &force_push
        description: Force push to override existing target branch
        type: boolean
        required: false
        default: false
      additional_repository: &additional_repository
        description: 'Additional repository to merge from'
        type: string
        required: false
        default: ''
      additional_branch: &additional_branch
        description: 'Branch from additional repository to merge'
        type: string
        required: false
        default: ''

  workflow_call:
    inputs:
      base_repository: *base_repository
      base_branch: *base_branch
      target_repository: *target_repository
      target_branch: *target_branch
      auto_fetch_prs: *auto_fetch_prs
      pr_labels: *pr_labels
      manual_pr_numbers: *manual_pr_numbers
      exclude_pr_numbers: *exclude_pr_numbers
      force_push: *force_push
      additional_repository: *additional_repository
      additional_branch: *additional_branch

jobs:
  presto-create-staging:
    permissions:
      contents: read
    uses: ./.github/workflows/create-staging-composite.yml
    with:
      base_repository: ${{ inputs.base_repository }}
      base_branch: ${{ inputs.base_branch }}
      target_repository: ${{ inputs.target_repository }}
      target_branch: ${{ inputs.target_branch }}
      auto_fetch_prs: ${{ inputs.auto_fetch_prs }}
      pr_labels: ${{ inputs.pr_labels }}
      manual_pr_numbers: ${{ inputs.manual_pr_numbers }}
      exclude_pr_numbers: ${{ inputs.exclude_pr_numbers }}
      force_push: ${{ inputs.force_push }}
      additional_repository: ${{ inputs.additional_repository }}
      additional_branch: ${{ inputs.additional_branch }}
      script_path: ./velox-testing/presto/scripts/create_staging.sh
    secrets:
      fork_pat: ${{ secrets.PRESTO_FORK_PAT }}
      project_board_pat: ${{ secrets.PROJECT_BOARD_TOKEN }}
