# CPU-specific overrides for the coordinator's config_native.properties.
# Applied after coordinator_native_overrides.properties. Unlike GPU device memory,
# all CPU worker query memory counts toward these limits. TPC-DS SF10 peaks at
# about 16.4 GiB (Q82) on CI runners.
#
# Used by: .github/workflows/presto-test.yml

query.max-memory=20GB
query.max-total-memory=20GB
