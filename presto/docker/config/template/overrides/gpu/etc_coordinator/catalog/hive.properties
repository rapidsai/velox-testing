# GPU native workers read SNAPPY Parquet which is not splittable at the file level.
hive.file-splittable=false

# Enable connector and Parquet predicate pushdown so the native cuDF reader can
# prune row groups using Parquet min/max statistics.
hive.pushdown-filter-enabled=true
hive.parquet.pushdown-filter-enabled=true
# Apply reader pushdown only to the largest fact tables.
hive.pushdown-filter-min-table-rows=1000000000
