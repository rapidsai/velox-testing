# Hive catalog dedicated to temporary benchmark CTAS output. Its file metastore root is
# mounted separately from PRESTO_DATA_DIR so source data can remain read-only.
connector.name=hive-hadoop2
hive.metastore=file
hive.metastore.catalog.dir=file:/var/lib/presto/data/hive/ctas_scratch_output
hive.allow-drop-table=true
# Native workers otherwise stage writes under their container-private /tmp,
# which prevents the coordinator from committing the files. Write directly to
# the shared scratch mount; interrupted runs are cleaned before the next run.
hive.temporary-staging-directory-enabled=false
